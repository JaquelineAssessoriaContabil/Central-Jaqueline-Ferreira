<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist de Documentos Societários</title>
<style>
@page { size: A4 landscape; margin: 8mm; }
:root { --rose:#8B5A6B; --gold:#C5A059; --ink:#2B2326; --muted:#7A6D70; --line:#D9CCCE; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif; color:var(--ink); font-size:10px; background:#fff; }
.company { height:194mm; overflow:hidden; display:flex; flex-direction:column; page-break-after:always; break-after:page; }
.company:last-child { page-break-after:auto; break-after:auto; }
header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--gold); padding-bottom:6px; margin-bottom:8px; gap:12px; }
.tag { font-size:9px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; }
h2 { margin:2px 0 0; font-size:16px; color:var(--rose); }
.meta { font-size:10px; color:var(--muted); text-align:right; line-height:1.6; white-space:nowrap; }
.setores { font-size:9.5px; color:var(--muted); background:#FAF6F6; border:1px solid var(--line); padding:6px 8px; margin-bottom:8px; line-height:1.8; }
.setores b { color:var(--ink); }
.grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:0 22px; flex:1; min-height:0; }
.sec h3 { font-size:11px; margin:6px 0 3px; color:var(--rose); border-bottom:1px solid var(--line); padding-bottom:2px; }
ul { list-style:none; margin:0; padding:0; }
li { padding:3px 0; font-size:10px; display:flex; align-items:center; gap:7px; }
.box { display:inline-block; width:12px; height:12px; border:1.5px solid var(--rose); border-radius:2px; flex:0 0 12px; }
.obs { margin-top:auto; font-size:10px; }
.line { display:block; border-bottom:1px solid var(--line); height:18px; margin-top:4px; }
</style></head><body>
<div id="root"></div>
<script>
const CLIENTES = [
  "Jaqueline Ferreira Assessoria Contábil Ltda (escritório)",
  "Trans JN Transporte Escolar Ltda",
  "Silveira Empreiteira e Mão de Obra Ltda",
  "Macaia Gestão Ltda",
  "Fachim Psicologia Ltda",
  "Fina Imports Ltda",
  "Luis Fernando Fermino - MEI",
  "Jonathan Gabriel Gonçalves Fermino - MEI",
  "Charles Fantin",
  "Melissa Schwartz Psicologia Ltda",
  "Neves Soluções Inteligentes Ltda",
  "Vedi Optica e Relojoaria Ltda",
  "Angélica Bresciani Polezo - MEI",
  "Aracelli Eliza Marque Sociedade Individual de Advocacia",
  "EW Transportes Ltda"
];

const COL1 = [
  { t: "1. Societário (empresa)", i: ["Contrato social original","Contrato social consolidado (versão vigente)","Alterações contratuais, em ordem cronológica","Atas: administradores, contas, lucros e capital","Termo de posse do administrador","Distrato, cessão ou exclusão de sócio (se houver)","Comprovante de integralização do capital","Acordo de quotistas e aditivos (se existir)"] },
  { t: "2. Sócios (pessoas físicas)", i: ["RG ou CNH e CPF de cada sócio","Comprovante de endereço de cada sócio","Estado civil e regime de bens (se casado)","Sócio PJ: contrato social e Cartão CNPJ da empresa sócia"] }
];

const COL2 = [
  { t: "3. Junta Comercial", i: ["Comprovante de arquivamento de cada alteração","Certidão simplificada (últimos 30 dias)","DBE ou requerimento de empresário (MEI)"] },
  { t: "4. Receita e cadastro", i: ["Cartão CNPJ atualizado"] },
  { t: "5. Prefeitura", i: ["Alvará de funcionamento (vigente)","Inscrição municipal","Alvará sanitário / Vigilância (se exigido)"] }
];

const COL3 = [
  { t: "6. Corpo de Bombeiros", i: ["CLCB (Certificado de Licença do Corpo de Bombeiros) vigente","Vistoria ou laudo, se exigido para a atividade"] }
];

function renderCol(secs) {
  return '<div>' + secs.map(s =>
    '<div class="sec"><h3>' + s.t + '</h3><ul>' +
    s.i.map(x => '<li><span class="box"></span>' + x + '</li>').join('') +
    '</ul></div>'
  ).join('') + '</div>';
}

function renderCompany(nome) {
  return '<section class="company">' +
    '<header><div><div class="tag">Checklist de documentos societários</div><h2>' + nome + '</h2></div>' +
    '<div class="meta">Competência: ______ / 2026<br>Data: ____/____/______</div></header>' +
    '<div class="setores"><b>Setores deste cliente (marque os que existem):</b> Fiscal · Depto. Pessoal · Férias/Rescisões · Financeiro · Contabilidade · Societário<br>' +
    '<span class="box"></span>Fiscal &nbsp; <span class="box"></span>DP &nbsp; <span class="box"></span>Férias/Rescisões &nbsp; <span class="box"></span>Financeiro &nbsp; <span class="box"></span>Contabilidade &nbsp; <span class="box"></span>Societário</div>' +
    '<div class="grid">' + renderCol(COL1) + renderCol(COL2) + renderCol(COL3) + '</div>' +
    '<div class="obs"><b>Validade dos alvarás / CLCB:</b><span class="line"></span></div>' +
    '<div class="obs"><b>Pendências / observações:</b><span class="line"></span><span class="line"></span></div>' +
    '</section>';
}

document.getElementById('root').innerHTML = CLIENTES.map(renderCompany).join('');
</script>
</body></html>
